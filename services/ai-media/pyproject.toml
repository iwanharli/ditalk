[project]
name = "ditalk-ai-media"
version = "0.1.0"
description = "Local media feature extraction (prosody, OCR, transcode) for ditalk"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
audio = ["librosa>=0.10", "soundfile>=0.12"]
ocr = ["paddleocr>=2.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
